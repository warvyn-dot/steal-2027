<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Steal 2027: crew dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Tilt+Neon&family=Yellowtail&display=swap">
<link rel="stylesheet" href="styles.css?v=20261125e">
</head>
<body>
<main class="page" style="max-width: 900px">
  <div class="topbar admin-top">
    <span class="tag tag-act">Crew only</span>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Switch to day"><img class="theme-icon theme-sun" src="assets/img/theme-sun.png" alt="" width="52" height="52"><img class="theme-icon theme-moon" src="assets/img/theme-moon.png" alt="" width="52" height="52" onerror="this.closest('button').classList.add('no-moon')"><span class="theme-fallback" aria-hidden="true">Night</span></button>
    <a href="index.html">Guest page</a>
  </div>

  <section class="card" id="gate" aria-labelledby="gate-h">
    <h1 id="gate-h" style="font-size: 28px; line-height: 34px; font-weight: 600">Enter the PIN</h1>
    <form id="pin-form" class="row" novalidate>
      <div class="field" style="width: 160px"><label class="label" for="pin">PIN</label>
        <input id="pin" inputmode="numeric" autocomplete="off" maxlength="12" required></div>
      <button class="btn btn-primary" type="submit">Open dashboard</button>
    </form>
    <p class="status" id="pin-status" role="status"></p>
  </section>

  <div id="dash" hidden style="display: flex; flex-direction: column; gap: 14px">
    <div class="admin-head">
      <p class="script">The crew so far</p>
      <div class="admin-actions">
        <button class="btn" id="refresh" type="button">Refresh</button>
        <button class="btn btn-quiet" id="lock" type="button">Lock</button>
      </div>
    </div>
    <p class="status" id="dash-status" role="status"></p>

    <div class="stats">
      <div class="card"><span class="label">Guests coming</span><span class="stat-num" id="stat-guests">0</span></div>
      <div class="card"><span class="label">RSVPs</span><span class="stat-num" id="stat-rsvps">0</span></div>
      <div class="card"><span class="label">Crew supplies</span><span class="stat-num" id="stat-claims">0</span></div>
      <div class="card"><span class="label">Your run</span><span class="stat-num" id="stat-run">0</span></div>
    </div>

    <section class="card adm-card" aria-labelledby="run-h">
      <div class="adm-card-head">
        <h2 id="run-h" class="adm-h">Shopping run</h2>
        <span class="adm-count" id="run-count"></span>
      </div>
      <div class="ready-bar" aria-hidden="true"><div class="ready-fill" id="run-fill"></div></div>
      <div class="seg" role="tablist" aria-label="Show">
        <button type="button" role="tab" class="seg-btn" id="seg-todo" aria-selected="true">Still needed</button>
        <button type="button" role="tab" class="seg-btn" id="seg-all" aria-selected="false">Everything</button>
      </div>
      <h3 class="adm-sub">Your run <span class="muted small">Tap to check off</span></h3>
      <div id="host-list" class="check-groups"></div>
      <form id="host-add" class="host-add" novalidate>
        <label class="sr-only" for="host-new">Add something to your run</label>
        <input id="host-new" maxlength="80" placeholder="Add something to your run" autocomplete="off">
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
      <h3 class="adm-sub">From the crew <span class="muted small">Checks itself as guests claim</span></h3>
      <ul id="crew-checks" class="check-list"></ul>
    </section>

    <section class="card adm-card" aria-labelledby="guests-h">
      <div class="adm-card-head"><h2 id="guests-h" class="adm-h">Guest list</h2><span class="adm-count" id="guests-count"></span></div>
      <ul class="adm-rows" id="t-rsvps"></ul>
    </section>

    <section class="card adm-card" aria-labelledby="also-h2">
      <div class="adm-card-head"><h2 id="also-h2" class="adm-h">Also bringing</h2></div>
      <h3 class="adm-sub">Beer</h3>
      <ul class="adm-rows" id="t-beer"></ul>
      <h3 class="adm-sub">Something else</h3>
      <ul class="adm-rows" id="t-writeins"></ul>
    </section>

    <section class="card adm-card" aria-labelledby="prep-h">
      <div class="adm-card-head"><h2 id="prep-h" class="adm-h">Drink prep</h2></div>
      <div id="t-prep" class="prep-list"></div>
    </section>
  </div>
</main>
<script src="config.js?v=20261125e"></script>
<script src="shared.js?v=20261125e"></script>
<script src="admin.js?v=20261125e"></script>
</body>
</html>
